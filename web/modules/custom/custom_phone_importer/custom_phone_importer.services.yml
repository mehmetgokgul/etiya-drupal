services:
  custom_phone_importer.importer:
    class: 'Drupal\custom_phone_importer\Service\PhoneImporter'
    arguments: ['@state', '@config.factory', '@logger.factory']

  Drupal\custom_phone_importer\Commands\PhoneImportCommands:
    arguments: ['@custom_phone_importer.importer']
    tags:
      - { name: drush.command }
